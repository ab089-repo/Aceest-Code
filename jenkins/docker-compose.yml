name: aceest-jenkins

services:
  jenkins:
    build: .
    image: aceest-jenkins:lts
    container_name: aceest-jenkins
    ports:
      # Local build server: reachable from this machine only
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Copy jenkins/.env.example to jenkins/.env and set a password}
      ACEEST_REPO_URL: ${ACEEST_REPO_URL:-https://github.com/ab089-repo/Aceest-Code.git}
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
